[package]
name = "closure-script"
description = "Runtime-independent scripting boundaries for closure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
conformance = []
wasm = ["dep:wasmtime"]
lua = ["dep:mlua"]

[dependencies]
wasmtime = { version = "50.0.1", default-features = false, features = ["runtime", "cranelift", "std", "wat"], optional = true }
mlua = { version = "0.12.2", default-features = false, features = ["lua54", "vendored", "serialize"], optional = true }
async-trait.workspace = true
closure-core.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
wat = "1.263.0"

[lints]
workspace = true
