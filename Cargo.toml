[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/Fokiiiiiii/closure"
description = "A Rust-based Discord bot for servers of all sizes"

[workspace.dependencies]
closure-core = { path = "crates/closure-core" }
closure-config = { path = "crates/closure-config" }
closure-db = { path = "crates/closure-db" }
closure-discord = { path = "crates/closure-discord" }
closure-api = { path = "crates/closure-api" }
closure-i18n = { path = "crates/closure-i18n" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
dashmap = "6"
clap = { version = "4", features = ["derive", "env"] }
fluent-bundle = "0.16"
fluent-syntax = "0.12"
futures-util = "0.3"
jsonschema = { version = "0.60", default-features = false }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
proptest = "1"
schemars = "1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "json", "time"] }
subtle = "2"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.7", features = ["timeout", "limit", "trace", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
twilight-cache-inmemory = "0.17"
twilight-gateway = "0.17"
twilight-http = "0.17"
twilight-model = "0.17"
twilight-standby = "0.17"
unic-langid = "0.9"
twilight-util = { version = "0.17", features = ["builder", "permission-calculator"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
